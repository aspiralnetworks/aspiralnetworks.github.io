<html>

<head>
	<title>Message Sent | Aspiral Networks Pvt. Ltd.</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="/assets/css/main.css" />
	<link rel="stylesheet" href="/assets/css/nova-grid.css" />
	<noscript>
		<link rel="stylesheet" href="/assets/css/noscript.css" />
	</noscript>
</head>

<body class="no-sidebar is-preload">
	<div id="page-wrapper">

		<!-- Header -->
		<div id="header-placeholder"></div>

		<!-- Main -->
		<article id="main">

			<section class="ng-section">
				<div class="ng-container ng-narrow">
					<div class="ng-banner">
						<div
							style="width:56px;height:56px;border-radius:50%;background:var(--ng-accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:24px;">
							<span class="icon solid fa-check"></span>
						</div>
						<h2>Thanks — your message is on its way.</h2>
						<p>We've received what you sent and typically respond within 1–2 business days. If it's
							urgent, you can also reach us directly at <a
								href="mailto:contact@spiralnetworks.in">contact@spiralnetworks.in</a>.</p>
					</div>

					<div style="text-align:center;margin-top:36px;">
						<a href="/index.html" class="button primary">Back to home</a>
						<a href="/contact.html" class="button" style="margin-left:12px;">Send another message</a>
					</div>
				</div>
			</section>

		</article>

		<!-- Footer -->
		<div id="footer-placeholder"></div>

	</div>

	<!-- Scripts -->
	<script src="/assets/js/jquery.min.js"></script>
	<script src="/assets/js/jquery.dropotron.min.js"></script>
	<script src="/assets/js/jquery.scrollex.min.js"></script>
	<script src="/assets/js/jquery.scrolly.min.js"></script>
	<script src="/assets/js/browser.min.js"></script>
	<script src="/assets/js/breakpoints.min.js"></script>
	<script src="/assets/js/util.js"></script>
	<script src="/assets/js/main.js"></script>

	<script>
		// Load header from same folder
		fetch('/header.html')
			.then(res => res.text())
			.then(html => {
				document.getElementById('header-placeholder').innerHTML = html;
				initHeaderScripts();
				setupMobileNav();
			});

		fetch('/footer.html')
			.then(res => res.text())
			.then(html => {
				document.getElementById('footer-placeholder').innerHTML = html;

				// Initialize dropdown AFTER header is injected
				initHeaderScripts();
			});

		function initHeaderScripts() {
			$('#nav > ul').dropotron({
				offsetY: 0,
				hoverDelay: 0
			});
		}

		function setupMobileNav() {
			var $body = $('body');

			// Remove old panel/title
			$('#navPanel, #titleBar').remove();

			// Build title bar
			$('<div id="titleBar">' +
				'<a href="#navPanel" class="toggle"></a>' +
				'<span class="title">' + $('#logo').html() + '</span>' +
				'</div>').appendTo($body);

			// Generate mobile-friendly menu (navList = HTML5UP built-in)
			var navHtml = $('#nav').navList();

			// Build mobile nav panel
			$('<div id="navPanel">' +
				'<nav>' + navHtml + '</nav>' +
				'</div>')
				.appendTo($body)
				.panel({
					delay: 500,
					hideOnClick: true,
					hideOnSwipe: true,
					resetScroll: true,
					resetForms: true,
					side: 'left'
				});
		}
	</script>

</body>

</html>
